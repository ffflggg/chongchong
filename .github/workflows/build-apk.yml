name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install buildozer and deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-pip python3-setuptools \
            python3-dev zlib1g-dev libffi-dev libssl-dev autoconf build-essential \
            libtool automake unzip zip pkg-config openjdk-17-jdk \
            libncurses5-dev libncursesw5-dev cmake wget ccache
          python3 -m pip install --upgrade pip setuptools
          python3 -m pip install --user cython buildozer
          python3 -m pip install --user "meson>=0.63.3" meson-python ninja

      - name: Fetch freetype source (savannah.gnu.org is unreachable from runners)
        run: |
          cd ${{ github.workspace }}
          git clone --depth 1 --recurse-submodules --branch VER-2-14-1 https://github.com/freetype/freetype.git freetype-src
          cd freetype-src && bash autogen.sh

      - name: Fetch numpy source (p4a numpy recipe version misses the 'v' tag prefix)
        run: |
          cd ${{ github.workspace }}
          git clone --depth 1 --recurse-submodules --branch v2.4.0 https://github.com/numpy/numpy numpy-src

      - name: Setup p4a source with pip<26 pin (p4a issue #3364: pip>=26 self-upgrade corrupts venv pip)
        run: |
          cd ${{ github.workspace }}
          mkdir -p .buildozer/android/platform
          if [ ! -d .buildozer/android/platform/python-for-android/.git ]; then
            git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android
          fi
          for f in $(grep -rl 'pip install -U pip' .buildozer/android/platform/python-for-android); do
            sed -i 's|pip install -U pip|pip install -U "pip<26"|g' "$f"
          done
          grep -rn 'pip<26' .buildozer/android/platform/python-for-android/ | head -5

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p android_app/data
          export P4A_freetype_DIR=${{ github.workspace }}/freetype-src
          export P4A_numpy_DIR=${{ github.workspace }}/numpy-src
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-heart-apk
          path: bin/*.apk