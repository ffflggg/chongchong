name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install buildozer and deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git python3-pip python3-setuptools \
            python3-dev zlib1g-dev libffi-dev libssl-dev autoconf build-essential \
            libtool automake unzip zip pkg-config openjdk-17-jdk \
            libncurses5-dev libncursesw5-dev cmake wget ccache
          python3 -m pip install --upgrade pip setuptools
          python3 -m pip install cython buildozer

      - name: Fetch freetype source (savannah.gnu.org is unreachable from runners)
        run: |
          cd ${{ github.workspace }}
          mkdir -p freetype-src
          curl -fsSL -o freetype-src.tar.gz https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz
          tar xzf freetype-src.tar.gz -C freetype-src --strip-components=1

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          mkdir -p android_app/data
          export P4A_freetype_DIR=${{ github.workspace }}/freetype-src
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-heart-apk
          path: bin/*.apk